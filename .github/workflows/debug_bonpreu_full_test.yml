name: Debug Bon Preu Full Test (SeleniumBase headed)

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        part: ['3', '4']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Install dependencies
        run: pip install seleniumbase
      # A la branca: prova de les Parts 3 i 4 de Bon Preu amb el metode nou (API), sense Sheets
      - name: Run debug_bonpreu_parts_api
        env:
          PART: ${{ matrix.part }}
        run: xvfb-run -a python debug_bonpreu_parts_api.py
