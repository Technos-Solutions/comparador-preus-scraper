name: Debug Bon Preu Headed (SeleniumBase UC Mode)

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Install dependencies
        run: pip install seleniumbase
      - name: Run debug_bonpreu_headed
        run: xvfb-run -a python debug_bonpreu_headed.py
      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bonpreu-headed-debug
          path: |
            bonpreu_headed_debug.png
            bonpreu_headed_debug.html
