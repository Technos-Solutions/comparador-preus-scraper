name: Debug Bon Preu HTML

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver
      - name: Install dependencies
        run: pip install selenium
      - name: Run debug_bonpreu_html
        run: python debug_bonpreu_html.py
      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bonpreu-debug
          path: |
            bonpreu_debug.png
            bonpreu_debug.html
