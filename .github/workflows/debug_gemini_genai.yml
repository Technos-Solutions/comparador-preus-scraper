name: Debug Gemini (SDK nou google.genai vs vell / raonament)

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install gspread oauth2client google-generativeai google-genai
      # A master executa debug_gemini_genai.py; a la branca, refa Historic_Preus amb les
      # columnes quantitat i envas (20/10, REINICIAR=1; escriu nomes a Historic_Preus)
      - name: Run historic_preus (reiniciar)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: REINICIAR=1 python historic_preus.py
