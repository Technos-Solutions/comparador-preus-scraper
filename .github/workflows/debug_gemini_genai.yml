name: Debug Gemini (SDK nou google.genai vs vell / raonament)

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install gspread oauth2client google-generativeai google-genai
      # A master executa debug_gemini_genai.py; a la branca, revisio setmanal de la cadena i preus de la
      # llista de la botiga (10/11; nomes lectura de Sheets, sense Gemini)
      - name: Run debug_revisio_setmanal
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python debug_revisio_setmanal.py
