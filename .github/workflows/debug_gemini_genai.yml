name: Debug Gemini (SDK nou google.genai vs vell / raonament)

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install gspread oauth2client google-generativeai google-genai
      # A master executa debug_gemini_genai.py; a la branca, l'actualitzacio de marques blanques
      # comprovades a internet el 19/10 (escriu nomes a Marques_Blanques, sense Gemini)
      - name: Run aplicar_marques_blanques
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python aplicar_marques_blanques.py
