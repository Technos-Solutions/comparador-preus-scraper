name: Normalitzador v3 (atributs + marques blanques)

on:
  # El llanca la Part 5 en acabar la cadena setmanal (des de l'11/10), o a ma
  workflow_dispatch:
    inputs:
      max_productes:
        description: 'Maxim de productes nous a enviar a Gemini (0 = sense limit)'
        required: false
        default: '0'
      categories:
        description: 'Categories separades per comes (buit = totes)'
        required: false
        default: ''
      nomes_comparar:
        description: '1 = no cridar Gemini, nomes recalcular Comparacions_v3'
        required: false
        default: '0'

jobs:
  normalitzar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install gspread oauth2client google-genai
      # Historic de preus (des del 20/10): nomes desa preus nous o que canvien. Si falla, el
      # normalitzador s'executa igualment
      - name: Historic de preus
        continue-on-error: true
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python historic_preus.py
      - name: Run normalitzador_v3
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          MAX_PRODUCTES: ${{ github.event.inputs.max_productes }}
          CATEGORIES: ${{ github.event.inputs.categories }}
          NOMES_COMPARAR: ${{ github.event.inputs.nomes_comparar }}
        run: python normalitzador_v3.py
